[tool.poetry]
name = "address_book"
version = "0.1.0"
description = "Address book API built with FastAPI"
readme = "README.md"
authors = ["Amaldeep <amalatl6@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.103.0"
uvicorn = {extras = ["standard"], version = "^0.22.0"}
sqlalchemy = "^2.0.41"
asyncpg = "^0.30.0"
alembic = "^1.16.1"
python-dotenv = "^1.1.0"
aiosqlite = "^0.21.0"
pydantic = {extras = ["email"], version = "^2.11.5"}
loguru = "^0.7.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
httpx = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
